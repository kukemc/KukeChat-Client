  登录页设计稿 v4 · 方案 C「积木」+ 跟着表单实时变化的积木
  积木外观、拖动 / 吸附 / 运行沿用 ../index.html?c=C：scratchblocks@3.7.1（scratch3 主题，zh_cn）逐块渲染成 SVG，
  接缝处理（seamless / setJoin）原样搬过来。需要联网读 jsdelivr。背景是同一套渲染出来的「虚拟积木描边」。
  v4：
    · 每个输入框都驱动一块积木：登录 = 说「你好，<用户名>!」+ 将 [密码] 设为 [●●●]；
      注册 = 说「欢迎加入，<用户名>!」+ 将 [昵称] 设为 […]（填了昵称才接上来）+ 如果 <[密码] = [确认]> 那么 创建 […] 账号，
      两次密码一致时布尔积木由灰变绿。
    · 文本变了不换图：离屏渲染新 SVG，把现在这块的路径 / 参数槽 / 文字位置逐个数字插值过去（morph），文字交叉淡入淡出，
      每帧同步接缝，所以下面的积木不会跳。每帧最多渲染一次（rAF 合并输入）。
    · 登录 ⇄ 注册：共享的「当绿旗被点击」「说」原地变形，独有的积木脱离淡出，另一边的积木错开飞入、吸附上去；
      表单的下划线滑动、标题交叉淡入、多出来的输入框展开 / 收起、按钮文字变形，整体高度连续变化。
    · 动效关或系统减少动态效果：全部瞬时更新。

<style>
:root { --page:#e4e7ee; --page-text:#12141a; --page-muted:#676d7c; --page-card:#fff; --page-border:rgba(18,22,38,.1); color-scheme: light; }
:root[data-theme="dark"] { --page:#0b0c0f; --page-text:#e1e4ea; --page-muted:#8d93a2; --page-card:#15161b; --page-border:rgba(255,255,255,.09); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page); color: var(--page-text); }
body { font: 14px/1.6 Inter, 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ───────── 预览外壳 ───────── */
.top { position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 20px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--page-border); font-size: 12.5px; color: var(--page-muted); }
.top b { color: var(--page-text); font-size: 14px; font-weight: 600; }
.grp { display: flex; align-items: center; gap: 6px; }
.pill { display: flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--page-text) 7%, transparent); }
.pill button { padding: 4px 10px; border: 0; border-radius: 6px; background: none; color: var(--page-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.pill button.on { background: var(--page-card); color: var(--page-text); box-shadow: 0 0 0 1px var(--page-border); }
.intro { max-width: 960px; padding: 22px 20px 0; color: var(--page-muted); font-size: 13.5px; line-height: 1.7; }
.intro b { color: var(--page-text); font-weight: 600; }
.boards { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; padding: 22px 28px 60px; }
.cap { display: block; margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--page-muted); }
.slot { position: relative; }

/* ───────── 令牌（kui.css） ───────── */
.app { --fill:#1f6bff; --accent:#1f6bff; --on:#fff; --text:#12141a; --muted:#676d7c; --subtle:#a0a6b3; --border:rgba(18,22,38,.08); --bs:rgba(18,22,38,.15); --panel:#fff; --pm:#f0f1f5; --raise:#fff; --danger:#e0383e; --ok:#0d8f69;
  --ws:#f3f4f8; --dot:rgba(18,22,38,.09); --ol:#1a1f33; --ol-k:1; --ease:cubic-bezier(.16,1,.3,1); --sp:cubic-bezier(.2,.8,.2,1);
  position: relative; overflow: hidden; color: var(--text); font-size: 14px; line-height: 1.5; color-scheme: light; }
.app.dark { --accent:#5b93ff; --text:#e1e4ea; --muted:#8d93a2; --subtle:#636979; --border:rgba(255,255,255,.075); --bs:rgba(255,255,255,.14); --panel:#1b1d23; --pm:#212329; --raise:#26282f; --danger:#ff6369; --ok:#3ecf9f;
  --ws:#111217; --dot:rgba(255,255,255,.06); --ol:#c9d0e6; --ol-k:.62; color-scheme: dark; }

.desk { width: 1100px; height: 720px; display: grid; grid-template-columns: 1fr 470px; border-radius: 10px; background: var(--panel); box-shadow: 0 0 0 1px rgba(18,22,38,.12), 0 30px 70px -24px rgba(18,22,38,.4); }
.desk.dark { box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 30px 70px -24px rgba(0,0,0,.8); }
.tb { position: absolute; z-index: 30; top: 0; right: 0; display: flex; height: 40px; pointer-events: none; }
.tb span { display: grid; width: 46px; place-items: center; color: var(--muted); font-size: 15px; }
.phone { width: 412px; height: 892px; display: flex; flex-direction: column; border-radius: 40px; background: var(--panel); box-shadow: 0 0 0 10px #16171b, 0 0 0 11px rgba(255,255,255,.06), 0 30px 70px -24px rgba(18,22,38,.45); }
.sbar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 4px 28px 0 30px; font-size: 14px; font-weight: 600; pointer-events: none; }
.sbar .r { display: flex; gap: 6px; font-size: 15px; }
.gbar { position: absolute; z-index: 30; bottom: 8px; left: 50%; width: 120px; height: 4px; margin-left: -60px; border-radius: 2px; background: var(--text); opacity: .3; }

/* ───────── 工作区（方案 C 的点阵画板） ───────── */
.ws { position: relative; overflow: hidden; background-color: var(--ws); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.6px); background-size: 22px 22px; }
.desk .ws { display: flex; flex-direction: column; padding: 30px 40px 32px; border-right: 1px solid var(--border); }
.phone .ws { flex: none; height: 344px; padding: 52px 22px 0; border-bottom: 1px solid var(--border); transition: height .42s var(--sp); }
.phone.kb .ws { height: 216px; }
.brand { position: relative; z-index: 4; display: flex; align-items: center; flex: none; height: 34px; pointer-events: none; }
.phone .brand { height: 30px; }
.brand svg { display: block; height: 100%; width: auto; }
.stage { position: relative; z-index: 3; }
.desk .stage { flex: 1; margin: 6px -40px 10px; --bs: 1; }
.phone .stage { position: absolute; left: 0; right: 0; top: 92px; bottom: 0; --bs: .8; }
/* 手机键盘弹起：积木缩小留在原处，镜头跟着正在填的那块积木走，上下沿淡出 */
.phone.kb .stage { --bs: .6; -webkit-mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 26px), transparent); }
.claim { position: relative; z-index: 4; font-size: 22px; font-weight: 600; letter-spacing: -.015em; line-height: 1.45; pointer-events: none; }
.claim span { color: var(--accent); }
.meta { position: relative; z-index: 4; margin-top: 10px; color: var(--subtle); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ───────── 虚拟积木描边 ───────── */
.ol { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.ol-d { position: absolute; inset: 0; transition: transform 1.2s var(--ease); will-change: transform; }
.ol-s { position: absolute; left: 0; top: 0; overflow: visible; transform-origin: 50% 50%; opacity: calc(var(--o) * var(--ol-k)); color: var(--ol);
  animation: ol-drift var(--t, 60s) ease-in-out var(--dl, 0s) infinite alternate; }
.ol-s * { fill: none !important; stroke: currentColor !important; stroke-width: var(--sw) !important; stroke-linejoin: round; filter: none !important; }
@keyframes ol-drift { from { translate: 0 0; } to { translate: var(--dx, 10px) var(--dy, -14px); } }
.no-motion .ol-s { animation: none; }
.no-motion .ol-d { transition: none; transform: none !important; }

/* ───────── Scratch 3 积木（scratchblocks 渲染，同方案 C） ───────── */
.sb-layer { position: absolute; left: 0; top: 0; width: calc(100% / var(--bs, 1)); height: calc(100% / var(--bs, 1)); transform: translateY(var(--py, 0px)) scale(var(--bs, 1)); transform-origin: 0 0; transition: transform .42s var(--sp); touch-action: none; user-select: none; -webkit-user-select: none; }
.sb-probe { position: absolute; left: 0; top: 0; width: 100px; height: 0; visibility: hidden; }
.sb-blk { position: absolute; left: 0; top: 0; pointer-events: none; transform-origin: 0 0; transition: transform .4s var(--sp), opacity .25s; }
.sb-blk svg { display: block; overflow: visible; transition: filter .12s; }
.sb-blk .sb3-label { font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
.sb-blk path, .sb-blk rect, .sb-blk text, .sb-blk use, .sb-blk image { pointer-events: auto; cursor: grab; }
.sb-blk.leaving, .sb-blk.leaving * { pointer-events: none !important; }
.sb-blk .pw-bool { transition: fill .32s var(--sp), stroke .32s var(--sp); }
.sb-blk.glow svg { filter: drop-shadow(0 0 1px #fff200) drop-shadow(0 0 2px #fff200) drop-shadow(0 0 5px rgba(255,228,0,.75)); }
.sb-drag { position: absolute; left: 0; top: 0; z-index: 500; will-change: transform; }
.sb-lift { transition: transform .16s var(--ease), filter .16s; }
.sb-lift.on { transform: scale(1.04); filter: drop-shadow(0 14px 14px rgba(18,22,38,.26)) drop-shadow(0 2px 3px rgba(18,22,38,.16)); }
.dark .sb-lift.on { filter: drop-shadow(0 16px 16px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.sb-drag .sb-blk { transition: none; }
.sb-drag .sb-blk path, .sb-drag .sb-blk rect, .sb-drag .sb-blk text, .sb-drag .sb-blk use { cursor: grabbing; }
.sb-ghost { position: absolute; left: 0; top: 0; z-index: 0; opacity: .2; pointer-events: none; }
.sb-ghost svg { position: absolute; left: 0; overflow: visible; }
.sb-ghost path { fill: #000 !important; stroke: none !important; }
.dark .sb-ghost { opacity: .22; }
.dark .sb-ghost path { fill: #fff !important; }
.sb-say { position: absolute; z-index: 3; bottom: calc(100% - 6px); left: calc(100% - 26px); padding: 7px 13px; border: 2px solid rgba(0,0,0,.15); border-radius: 16px; background: #fff; background-clip: padding-box; color: #575e75; font: 600 14px/1.3 'Helvetica Neue', Helvetica, Arial, 'Microsoft YaHei UI', sans-serif; white-space: nowrap; pointer-events: none; transform-origin: 18px 100%; animation: sb-pop .3s cubic-bezier(.19,1.18,.22,1); }
.sb-say::after { position: absolute; left: 14px; bottom: -9px; width: 12px; height: 12px; border: solid rgba(0,0,0,.15); border-width: 0 0 2px 2px; border-bottom-left-radius: 3px; background: #fff; transform: skewY(-38deg); content: ''; }
.sb-say.out { opacity: 0; transform: scale(.9); transition: opacity .2s, transform .2s; }
@keyframes sb-pop { from { opacity: 0; transform: scale(.6); } }
.sb-val { position: absolute; top: calc(100% + 6px); left: 50%; padding: 3px 10px; border: 1px solid rgba(0,0,0,.15); border-radius: 8px; background: #fff; color: #575e75; font: 600 13px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; transform: translateX(-50%); box-shadow: 0 2px 6px -2px rgba(0,0,0,.15); }
.sb-val::before { position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border: solid rgba(0,0,0,.15); border-width: 1px 0 0 1px; background: #fff; transform: rotate(45deg); content: ''; }
.sb-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.no-motion .sb-blk, .no-motion .sb-lift, .no-motion .sb-blk svg, .no-motion .sb-layer, .no-motion .pw-bool { transition: none !important; }
.no-motion .sb-lift.on { transform: none; }
.no-motion .sb-say { animation: none; }

/* ───────── 表单（方案 C：胶囊输入框 + 积木凹口主按钮） ───────── */
.form { position: relative; z-index: 2; display: flex; flex-direction: column; }
.desk .form { justify-content: center; padding: 40px 52px; }
.phone .form { flex: 1; padding: 24px 22px 26px; }
.tabs { position: relative; display: flex; gap: 22px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.tabs button { padding: 0 0 10px; border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: color .3s var(--sp); }
.tabs button.on { color: var(--text); }
.tab-ink { position: absolute; left: 0; bottom: -1px; width: 0; height: 2px; border-radius: 2px; background: var(--fill); transition: transform .42s var(--sp), width .42s var(--sp); }
.h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
.sub { margin-top: 6px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.phone .h1, .phone .sub { display: none; }
.btn > span { display: inline-flex; align-items: center; gap: 8px; }
.h1 > span, .sub > span, .btn-pri > span { display: inline-flex; align-items: center; gap: 8px; will-change: transform, opacity; }
.fields { margin-top: 10px; }
.phone .fields { margin-top: -14px; }
.fields .f { padding-top: 14px; }
/* 只在一种模式里出现的东西：高度从 0fr 展开到 1fr，同时淡入；内容外面留 3px 给聚焦光圈 */
.clp { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .42s var(--sp), opacity .22s ease; }
.clp.open { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .42s var(--sp), opacity .3s ease .06s; }
.clp > div { min-height: 0; overflow: hidden; padding: 3px; margin: -3px; }
.no-motion .clp { transition: none !important; }
.f-l { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: color-mix(in srgb, var(--text) 74%, var(--muted)); }
.f-l em { font-style: normal; font-weight: 500; color: var(--subtle); }
.f-box { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 16px; border: 1px solid var(--bs); border-radius: 22px; background: var(--panel); transition: border-color .18s, box-shadow .18s; }
.f-box:focus-within { border-color: var(--fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fill) 18%, transparent); }
.f.err .f-box { border-color: color-mix(in srgb, var(--danger) 65%, transparent); }
.f.err .f-box:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 15%, transparent); }
.f-box > svg { font-size: 16px; color: var(--subtle); }
.f-box:focus-within > svg { color: var(--accent); }
.f-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14.5px; }
.f-box input::placeholder { color: var(--subtle); }
.eye { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 16px; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
.eye:hover { background: var(--pm); }
.hint { padding-top: 6px; color: var(--subtle); font-size: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; color: var(--muted); font-size: 12.5px; }
.link { color: var(--accent); font-weight: 600; cursor: pointer; }
.alert { display: none; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 8%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 24%, transparent); color: var(--danger); font-size: 13px; line-height: 1.5; }
.alert.on { display: flex; }
.alert svg { margin-top: 2px; font-size: 15px; }
.btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 44px; border: 0; border-radius: 8px; font-size: 14.5px; font-weight: 600; letter-spacing: .01em; cursor: pointer; }
/* 主按钮 = 一条 SVG 路径：圆角矩形 + 顶部 Scratch 凹口 + 底部凸起，没有叠加的伪元素，也就没有接缝线 */
.btn-pri { --bg: var(--fill); margin-top: 20px; background: none; color: var(--on); outline: none; }
.btn-bg { position: absolute; left: 0; top: 0; width: 100%; height: 52px; overflow: visible; pointer-events: none; }
.btn-bg path { fill: var(--bg); transition: fill .3s var(--sp); shape-rendering: geometricPrecision; }
.btn-pri > span { position: relative; }
.btn-pri:hover { --bg: color-mix(in srgb, var(--fill) 92%, #000); }
.btn-pri:active { --bg: color-mix(in srgb, var(--fill) 84%, #000); }
.btn-pri:focus-visible .btn-bg { filter: drop-shadow(0 0 0 var(--fill)) drop-shadow(0 0 3px color-mix(in srgb, var(--fill) 55%, transparent)); }
.btn-pri.loading { --bg: color-mix(in srgb, var(--fill) 82%, var(--panel)); }
.btn-pri.ok { --bg: var(--ok); }
.btn-pri .arrow { font-size: 16px; margin-left: -2px; }
.spin { font-size: 17px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.or { display: flex; align-items: center; gap: 12px; padding-top: 18px; color: var(--subtle); font-size: 12px; }
.or::before, .or::after { flex: 1; height: 1px; background: var(--border); content: ''; }
.btn-sec { margin-top: 14px; border: 1px solid var(--bs); background: var(--panel); color: var(--text); }
.btn-sec svg { color: var(--accent); font-size: 17px; }
.badge { padding: 0 6px; border-radius: 5px; background: color-mix(in srgb, var(--fill) 13%, transparent); color: var(--accent); font-size: 11px; font-weight: 600; line-height: 18px; }
.note { margin-top: 8px; color: var(--subtle); font-size: 12px; text-align: center; }
.foot { margin-top: auto; padding-top: 16px; color: var(--subtle); font-size: 11.5px; text-align: center; }
.desk .foot { display: none; }
@media (prefers-reduced-motion: reduce) {
  .sb-blk, .sb-lift, .sb-blk svg, .sb-layer, .pw-bool, .clp, .tab-ink, .phone .ws { transition: none !important; }
  .sb-lift.on { transform: none; }
  .sb-say { animation: none; }
  .ol-s { animation: none; }
  .ol-d { transition: none; transform: none !important; }
}

<p class="intro">方案 C 的<b>真 Scratch 3 积木</b>（scratchblocks 渲染）现在跟着表单实时变：用户名写进「说」，密码变成一串圆点（不会显示真实密码）；注册时填昵称会接上一块「将 [昵称] 设为」，两次密码一致时「如果」里的布尔积木由灰变绿。切换登录 / 注册：共享的积木原地变形，其余积木脱离、飞入、吸附。积木照样能拖、点一下运行；密码输 <b>wrong</b> 看错误态。</p>

function moveDrag(W, e) {

/* ═════════ 表单动效小工具 ═════════ */
/* 文字交叉淡入 + 轻微上移；连续切换时以最后一次为准 */
function swap(node, html) {
  const cur = node._to ?? node.innerHTML; if (cur === html) return;
  node.getAnimations().forEach((a) => a.cancel());
  if (reduceMotion()) { node.innerHTML = html; node._to = null; return; }
  if (node.innerHTML === html) { node._to = null; node.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' }); return; }
  node._to = html;
  const out = node.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-5px)' }], { duration: 130, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
  out.onfinish = () => {
    if (node._to !== html) return;
    node.innerHTML = html; node._to = null; out.cancel();
    node.animate([{ opacity: 0, transform: 'translateY(5px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });

}
/* Scratch 命令积木的凹口曲线（原版深 8，这里按 0.75 压到 6），宽 32，起点距左边 16 */
const NOTCH_DN = 'c2,0 3,.75 4,1.5 l4,3 c1,.75 2,1.5 4,1.5 h12 c2,0 3,-.75 4,-1.5 l4,-3 c1,-.75 2,-1.5 4,-1.5';
const NOTCH_UP = 'c-2,0 -3,.75 -4,1.5 l-4,3 c-1,.75 -2,1.5 -4,1.5 h-12 c-2,0 -3,-.75 -4,-1.5 l-4,-3 c-1,-.75 -2,-1.5 -4,-1.5';
function btnPath(w, h = 44, r = 8) {
  return `M0,${r} A${r},${r} 0 0 1 ${r},0 H16 ${NOTCH_DN} H${w - r} A${r},${r} 0 0 1 ${w},${r} V${h - r} A${r},${r} 0 0 1 ${w - r},${h} H48 ${NOTCH_UP} H${r} A${r},${r} 0 0 1 0,${h - r} Z`;
}
function shapeButton(btn) {
  const path = btn.querySelector('.btn-bg path');
  const draw = () => { const w = btn.offsetWidth; if (w) path.setAttribute('d', btnPath(w, btn.offsetHeight || 44)); };
  draw(); new ResizeObserver(draw).observe(btn);
}
function setNow(node, html) { node.getAnimations().forEach((a) => a.cancel()); node._to = null; node.innerHTML = html; }

/* ═════════ 页面 ═════════ */
let UID = 0;
const ALL = [];
const brandSvg = (W, t) => WM[t === 'dark' ? 'dark' : 'light'].replace(/\b(id="|href="#|url\(#)(w[ld]-)/g, `$1$2${W.uid}-`).replace(/ width="[\d.]+" height="48"/, ' height="48" style="height:100%;width:auto"');
const clp = (name, inner, open) => `<div class="clp ${open ? 'open' : ''}" data-c="${name}" ${open ? '' : 'inert'}><div>${inner}</div></div>`;

function mount(host, kind) {
  const W = { uid: 'k' + (++UID), kind, mode: 'login', own: {}, codes: {}, morphs: {}, animSw: {}, arriving: new Set(), vars: { ...BASE_VARS }, run: 0, running: false, busy: false, raf: 0 };
  const desk = kind === 'desk';
  const root = el(`<div class="app ${kind}"></div>`);
  host.appendChild(root);
  root.innerHTML = `
    ${desk ? `<div class="tb"><span>${ic('minus')}</span><span>${ic('square')}</span><span>${ic('x')}</span></div>`
      : `<div class="sbar"><span>9:41</span><span class="r">${ic('signal')}${ic('wifi')}${ic('battery')}</span></div><div class="gbar"></div>`}
    <section class="ws">
      <div class="ol" aria-hidden="true"></div>
      <div class="brand"></div>
      <div class="stage"></div>
      ${desk ? `<p class="claim">给 Scratcher 的聊天室：<br><span>做作品、找队友、交朋友。</span></p><p class="meta">${VERSION} · 桌面版</p>` : ''}
    </section>
    <form class="form" autocomplete="off" novalidate>
      <div class="tabs" role="tablist"><button type="button" data-m="login" class="on" role="tab" aria-selected="true">登录</button><button type="button" data-m="reg" role="tab" aria-selected="false">注册新账号</button><i class="tab-ink"></i></div>
      <p class="h1"><span data-r="h1">欢迎回来</span></p>
      <p class="sub"><span data-r="sub">登录后继续你的 Scratch 社交空间。</span></p>
      <div class="fields">
        <div class="f" data-f="user"><div class="f-l">用户名</div><label class="f-box">${ic('user')}<input name="u" placeholder="输入用户名" autocapitalize="off" spellcheck="false"></label>${clp('uhint', '<div class="hint">3–50 个字符，之后不能修改。</div>')}</div>
        ${clp('nick', `<div class="f" data-f="nick"><div class="f-l">昵称<em>选填</em></div><label class="f-box">${ic('smile')}<input name="n" placeholder="显示给别人看的名字"></label></div>`)}
        <div class="f" data-f="pass"><div class="f-l">密码</div><label class="f-box">${ic('lock')}<input name="p" type="password" placeholder="输入密码"><button class="eye" type="button" data-a="eye" aria-label="显示密码">${ic('eye')}</button></label></div>
        ${clp('conf', `<div class="f" data-f="conf"><div class="f-l">确认密码</div><label class="f-box">${ic('lock')}<input name="c" type="password" placeholder="再输入一次"></label></div>`)}
      </div>
      ${clp('row', `<div class="row"><span>${desk ? '普通登录不会保存登录状态' : '登录后会自动保存登录状态'}</span><span class="link">忘记密码？</span></div>`, true)}
      <div class="alert" data-r="alert" role="alert">${ic('alert')}<span></span></div>
      <button class="btn btn-pri" type="submit"><svg class="btn-bg" aria-hidden="true"><path/></svg><span data-r="go"></span></button>
      ${desk ? clp('secure', `<div class="or">或</div><button type="button" class="btn btn-sec"><span>${ic('shield')}安全登录<span class="badge">推荐</span></span></button><p class="note">安全登录后，下次打开会自动同步登录状态</p>`, true) : ''}
      <p class="foot">${VERSION} · Android</p>
    </form>`;
  const $r = (n) => root.querySelector(`[data-r="${n}"]`);
  const ws = $('.ws', root); const form = $('.form', root); const ink = $('.tab-ink', root);
  W.stage = $('.stage', root);
  const inU = form.elements.u, inN = form.elements.n, inP = form.elements.p, inC = form.elements.c;
  const goHtml = () => (W.mode === 'reg' ? '创建账号' : `登录${ic('arrow', 'arrow')}`);
  setNow($r('go'), goHtml());
  shapeButton($('.btn-pri', root));

  mountOutlines(ws, kind);
  mountBlocks(W);
  bindDrag(W);

  const readVars = () => { W.vars.name = clean(inU.value.trim()); W.vars.nick = clean(inN.value.trim()); W.vars.pw = inP.value; W.vars.conf = inC.value; };
  function setError(field, msg) {
    root.querySelectorAll('.f.err').forEach((f) => f.classList.remove('err'));
    if (field) form.querySelector(`[data-f="${field}"]`).classList.add('err');
    const al = $r('alert'); al.querySelector('span').textContent = msg || ''; al.classList.toggle('on', !!msg);
  }
  [inU, inN, inP, inC].forEach((i) => i.addEventListener('input', () => { setError(); readVars(); if (reduceMotion()) sync(W); else schedule(W); }));

  /* 手机：键盘弹起 → 画板变矮、积木缩小，镜头对准正在填的那块积木 */
  const FOCUS_BLOCK = { u: () => (W.mode === 'reg' ? 'ifc' : 'say'), n: () => 'nick', p: () => (W.mode === 'reg' ? 'ifc' : 'pw'), c: () => 'ifc' };
  function pan() {
    if (desk || !W.layer) return;
    const a = document.activeElement; const kb = root.classList.contains('kb');
    let py = 0;
    if (kb && a && FOCUS_BLOCK[a.name]) {
      const bid = FOCUS_BLOCK[a.name]() ; const s = findStack(W, bid);
      if (s) {
        const top = s.y + stackH(s.ids.slice(0, s.ids.indexOf(bid))); const bottom = top + cc(W, bid).h;
        const view = (216 - 92) / .6 - 30; // 键盘态画板高度 / 缩放，再留出底部淡出
        py = -Math.max(0, Math.min(top - 6, bottom - view)) * .6;
      }
    }
    W.stage.style.setProperty('--py', `${Math.round(py)}px`);
  }
  W.onSync = pan;
  if (!desk) {
    form.addEventListener('focusin', () => { root.classList.add('kb'); pan(); });
    form.addEventListener('focusout', () => setTimeout(() => { if (!form.contains(document.activeElement)) { root.classList.remove('kb'); pan(); } }, 60));
  }
  root.querySelector('[data-a="eye"]').addEventListener('click', (e) => {
    const show = inP.type === 'password'; inP.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = ic(show ? 'eyeoff' : 'eye'); inP.focus({ preventScroll: true });
  });

  function moveInk(instant) {
    const b = form.querySelector('.tabs button.on');
    if (instant || reduceMotion()) { ink.style.transition = 'none'; }
    ink.style.width = `${b.offsetWidth}px`; ink.style.transform = `translateX(${b.offsetLeft}px)`;
    if (instant || reduceMotion()) { ink.offsetWidth; ink.style.transition = ''; }
  }
  requestAnimationFrame(() => moveInk(true));
  root.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));

  function setOpen(name, open, delay) {
    const c = form.querySelector(`[data-c="${name}"]`); if (!c) return;
    c.style.transitionDelay = reduceMotion() ? '0ms' : `${delay}ms`;
    c.classList.toggle('open', open); c.inert = !open;
  }
  function setMode(m) {
    if (m === W.mode) return;
    W.mode = m; W.vars.mode = m; setError();
    const reg = m === 'reg';
    root.classList.toggle('reg', reg);
    root.querySelectorAll('.tabs button').forEach((b) => { b.classList.toggle('on', b.dataset.m === m); b.setAttribute('aria-selected', b.dataset.m === m); });
    moveInk();
    // 展开：提示 → 昵称 → 确认密码 依次；收起反过来。登录独有的「忘记密码」「安全登录」同步收 / 放
    if (reg) { setOpen('row', false, 0); setOpen('secure', false, 0); setOpen('uhint', true, 40); setOpen('nick', true, 70); setOpen('conf', true, 140); }
    else { setOpen('conf', false, 0); setOpen('nick', false, 50); setOpen('uhint', false, 90); setOpen('row', true, 110); setOpen('secure', true, 150); }
    inU.placeholder = reg ? '字母、数字、_ . -' : '输入用户名';
    inP.placeholder = reg ? '至少 6 位' : '输入密码';
    swap($r('h1'), reg ? '创建账号' : '欢迎回来');
    swap($r('sub'), reg ? '起个名字，几秒钟就好。' : '登录后继续你的 Scratch 社交空间。');
    swap($r('go'), goHtml());
    // 焦点在被收起的输入框里 → 挪回用户名
    const a = document.activeElement;
    if (a && form.contains(a) && a.closest('.clp:not(.open)')) inU.focus({ preventScroll: true });
    switchBlocks(W); pan();
  }

  const fail = (field, msg) => { setError(field, msg); form.querySelector(`[data-f="${field}"] input`)?.focus({ preventScroll: true }); };
  async function submit() {
    if (W.busy) return;
    const reg = W.mode === 'reg'; const name = inU.value.trim(); const pw = inP.value;
    if (!name) return fail('user', '请输入用户名。');
    if (reg && !/^[A-Za-z0-9_.-]{3,50}$/.test(name)) return fail('user', '用户名仅可使用英文字母、数字、下划线、点和短横线。');
    if (!pw) return fail('pass', '请输入密码。');
    if (reg && pw.length < 6) return fail('pass', '密码至少 6 位。');
    if (reg && pw !== inC.value) return fail('conf', '两次输入的密码不一致。');
    W.busy = true; setError();
    document.activeElement?.blur?.();
    const btn = $('.btn-pri', form);
    btn.classList.add('loading'); setNow($r('go'), `${ic('loader', 'spin')}${reg ? '正在创建…' : '正在登录…'}`);
    touch(W);
    await runIds(W, mainIds(W));
    btn.classList.remove('loading');
    if (!reg && pw === 'wrong') { setNow($r('go'), goHtml()); setError('pass', '用户名或密码错误，请检查后再试。'); }
    else {
      btn.classList.add('ok'); setNow($r('go'), `${ic('check')}${reg ? '账号已创建' : '登录成功'}`);
      await wait(2400); btn.classList.remove('ok'); swap($r('go'), goHtml());
    }
    W.busy = false;
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });

  const api = {
    W, root,
    theme(t) { root.classList.toggle('dark', t === 'dark'); $('.brand', root).innerHTML = brandSvg(W, t); },
    motion(m) { root.classList.toggle('no-motion', m === 'off'); },
    preset(s) {
      W.busy = false; setError();
      const btn = $('.btn-pri', form); btn.classList.remove('ok', 'loading');

      if (s === 'reg') { setMode('reg'); return; }
      if (W.mode !== 'login') setMode('login');
      setNow($r('go'), goHtml()); inP.type = 'password';
      if (s === 'idle') { set(inU, ''); set(inP, ''); document.activeElement?.blur?.(); return; }
      if (s === 'user') { set(inP, ''); set(inU, 'kuke_cat'); return; }
      if (s === 'pass') { set(inU, 'kuke_cat'); set(inP, 'hunter22'); return; }
      if (s === 'ok') { set(inU, 'kuke_cat'); set(inP, 'hunter22'); setTimeout(submit, 120); return; }
      if (s === 'bad') { set(inU, 'kuke_cat'); set(inP, 'wrong'); setTimeout(submit, 120); }
    },
    setMode
  };
  ALL.push(api);
  return api;
}

function fit() {
  document.querySelectorAll('.slot').forEach((slot) => {
    const inner = slot.firstElementChild, w = +slot.dataset.w, h = +slot.dataset.h, sc = +slot.dataset.s;
    inner.style.transform = `scale(${sc})`; inner.style.transformOrigin = '0 0';
    inner.style.width = w + 'px'; inner.style.height = h + 'px';
    slot.style.width = w * sc + 'px'; slot.style.height = h * sc + 'px';
  });
}
const mark = (id, v, key = 'v') => document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset[key] === v));
function applyTheme() { document.documentElement.dataset.theme = S.theme; ALL.forEach((a) => a.theme(S.theme)); mark('p-theme', S.theme); }
function applyMotion() { ALL.forEach((a) => a.motion(S.motion)); mark('p-motion', S.motion); }
function boot() {
  const boards = $('#boards');
  [['desk', '桌面端 · 1100×720', 1100, 720, .82], ['phone', '手机端 · 412×892', 412, 892, .82]].forEach(([kind, cap, w, h, s]) => {
    const wrap = el(`<div><span class="cap">${cap}</span><div class="slot" data-w="${w}" data-h="${h}" data-s="${s}"><div></div></div></div>`);
    boards.appendChild(wrap);
    fit();
    mount($('.slot > div', wrap), kind);
  });
  fit(); applyTheme(); applyMotion();
  const s0 = q.get('s'); if (s0) { mark('p-state', s0, 's'); ALL.forEach((a) => a.preset(s0)); }
}
$('#p-theme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.theme = b.dataset.v; applyTheme(); } });
$('#p-motion').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.motion = b.dataset.v; applyMotion(); } });
$('#p-state').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { mark('p-state', b.dataset.s, 's'); ALL.forEach((a) => a.preset(b.dataset.s)); } });
boot();
