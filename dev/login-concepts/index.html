<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录页设计方案</title>
<!--
  KukeChat 登录 / 注册页的设计稿（静态，只用来挑方案，不进任何构建）。
  直接用浏览器打开本文件即可。A/B/D 的 Logo 还读 ../../src/assets/logo.png（读不到时用占位图形）；
  C 用 KukeChat 图标的矢量复刻版（见 ./logo.html、./logo/），积木用 jsdelivr 上的 scratchblocks@3.7.1 渲染，需要联网。
  品牌名、口号、版本号在下面脚本顶部的 BRAND / TAGLINE / VERSION 三个常量里，改一处全部跟着变。
  地址参数：?c=A|B|C|D|all  &theme=light|dark|both  &st=idle|focus|error|loading  &kb=1  &zoom=0.6
-->
<style>
:root {
  --page: #e4e7ee;
  --page-text: #12141a;
  --page-muted: #676d7c;
  --page-card: #ffffff;
  --page-border: rgba(18, 22, 38, 0.1);
  --page-accent: #1f6bff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --page: #0b0c0f; --page-text: #e1e4ea; --page-muted: #8d93a2; --page-card: #15161b; --page-border: rgba(255, 255, 255, 0.09); --page-accent: #5b93ff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --page: #0b0c0f; --page-text: #e1e4ea; --page-muted: #8d93a2; --page-card: #15161b; --page-border: rgba(255, 255, 255, 0.09); --page-accent: #5b93ff;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page); color: var(--page-text); }
body { font: 14px/1.6 Inter, 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', sans-serif; -webkit-font-smoothing: antialiased; }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ───────── 页面外壳 ───────── */
.top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px; border-bottom: 1px solid var(--page-border); background: color-mix(in srgb, var(--page-card) 88%, transparent); backdrop-filter: blur(14px); }
.top h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; margin-right: 6px; }
.grp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--page-muted); }
.grp > span { margin-right: 2px; }
.pill { display: flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--page-text) 6%, transparent); }
.pill button { padding: 4px 10px; border: 0; border-radius: 6px; background: none; color: var(--page-muted); font: 600 12px/1.4 inherit; font-family: inherit; cursor: pointer; }
.pill button.on { background: var(--page-card); color: var(--page-text); box-shadow: 0 0 0 1px var(--page-border), 0 1px 2px rgba(0, 0, 0, 0.08); }
.intro { max-width: 980px; padding: 28px 20px 4px; color: var(--page-muted); font-size: 13.5px; }
.intro b { color: var(--page-text); }
.concept { padding: 28px 20px 8px; }
.concept-head { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; max-width: 1080px; margin-bottom: 18px; }
.concept-tag { grid-row: span 2; display: grid; width: 44px; height: 44px; place-items: center; border-radius: 12px; background: var(--page-card); box-shadow: 0 0 0 1px var(--page-border); font-size: 18px; font-weight: 800; color: var(--page-accent); }
.concept-head h2 { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.3; }
.concept-head h2 small { margin-left: 10px; color: var(--page-muted); font-size: 13px; font-weight: 500; letter-spacing: 0; }
.concept-head p { color: var(--page-muted); font-size: 13.5px; max-width: 900px; }
.concept-notes { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.concept-notes span { padding: 2px 8px; border-radius: 6px; background: var(--page-card); box-shadow: 0 0 0 1px var(--page-border); color: var(--page-muted); font-size: 12px; }
.board { display: flex; flex-direction: column; gap: 28px; zoom: var(--zoom, 0.6); }
.theme-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; }
.cap { display: block; margin-bottom: 10px; color: var(--page-muted); font-size: 18px; font-weight: 600; }
.cap b { color: var(--page-text); }
hr.sep { margin: 26px 20px 0; border: 0; border-top: 1px solid var(--page-border); }

/* ───────── 设计令牌（取自 kui.css / 设计文档） ───────── */
.frame {
  --fill: #1f6bff; --accent: #1f6bff; --on: #ffffff; --violet: #7a55d6;
  --text: #12141a; --muted: #676d7c; --subtle: #a0a6b3;
  --border: rgba(18, 22, 38, 0.08); --bs: rgba(18, 22, 38, 0.15);
  --window: #eceef3; --rail: #e2e4eb; --chat: #f5f6f9; --panel: #ffffff; --pm: #f0f1f5; --raise: #ffffff;
  --hover: rgba(18, 22, 38, 0.055);
  --danger: #e0383e; --warn: #b06a00; --ok: #0d8f69;
  --bubble-in: #ffffff; --bubble-shadow: 0 1px 1.5px rgba(18, 22, 38, 0.07), 0 3px 8px -3px rgba(18, 22, 38, 0.09);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; flex: none; overflow: hidden;
  color: var(--text);
  font-family: Inter, 'Segoe UI Variable Text', 'Segoe UI', 'SF Pro Text', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', sans-serif;
  font-size: 14px; line-height: 1.5;
  color-scheme: light;
}
.frame.dark {
  --accent: #5b93ff;
  --text: #e1e4ea; --muted: #8d93a2; --subtle: #636979;
  --border: rgba(255, 255, 255, 0.075); --bs: rgba(255, 255, 255, 0.14);
  --window: #0b0c0f; --rail: #090a0c; --chat: #0e0f12; --panel: #1b1d23; --pm: #212329; --raise: #26282f;
  --hover: rgba(255, 255, 255, 0.06);
  --danger: #ff6369; --warn: #f0b03f; --ok: #3ecf9f;
  --bubble-in: #22242a; --bubble-shadow: 0 1px 2px rgba(0, 0, 0, 0.32);
  color-scheme: dark;
}

/* 桌面窗口 1100×720 */
.desk { width: 1100px; height: 720px; border-radius: 10px; background: var(--panel); box-shadow: 0 0 0 1px rgba(18, 22, 38, 0.12), 0 30px 70px -24px rgba(18, 22, 38, 0.45); }
.desk.dark { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 30px 70px -24px rgba(0, 0, 0, 0.8); }
.tb { position: absolute; z-index: 5; top: 0; right: 0; display: flex; height: 40px; }
.tb span { display: grid; width: 46px; place-items: center; color: var(--muted); font-size: 15px; }
.tb.on-dark span { color: rgba(255, 255, 255, 0.7); }

/* 手机 412×892（外面一圈机身） */
.phone-wrap { padding: 10px; border-radius: 50px; background: #16171b; box-shadow: 0 30px 60px -24px rgba(18, 22, 38, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.phone { width: 412px; height: 892px; border-radius: 40px; display: flex; flex-direction: column; background: var(--panel); }
.sb { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 4px 28px 0 30px; font-size: 14px; font-weight: 650; color: var(--text); }
.sb .r { display: flex; gap: 6px; font-size: 15px; }
.sb.on-dark { color: #fff; }
.gb { position: absolute; z-index: 6; bottom: 8px; left: 50%; width: 120px; height: 4px; margin-left: -60px; border-radius: 2px; background: var(--text); opacity: 0.35; }
.gb.on-dark { background: #fff; }
.screen { position: relative; display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
.kbd { position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; height: 300px; padding: 10px 6px 40px; display: grid; grid-template-rows: repeat(4, 1fr); gap: 8px; background: #d3d6dd; }
.dark .kbd { background: #2a2c31; }
.kbd div { display: flex; gap: 6px; justify-content: center; }
.kbd i { flex: 1; max-width: 36px; border-radius: 6px; background: #fff; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18); }
.dark .kbd i { background: #4a4d55; }
.kbd div:last-child i:nth-child(2) { max-width: 200px; }
.phone.kb .screen { padding-bottom: 300px; }

/* ───────── 共用表单 ───────── */
.logo { position: relative; display: inline-block; flex: none; width: var(--s); height: var(--s); border-radius: 23%; background: #0d0f19; }
.logo > svg { position: absolute; inset: 22%; width: 56%; height: 56%; color: #8f7bff; }
.logo > img { position: absolute; inset: 0; width: 100%; height: 100%; }
.form { display: flex; flex-direction: column; width: 100%; }
.h { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.25; }
.sub { margin-top: 6px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.fields { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
.f { display: block; }
.f-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: color-mix(in srgb, var(--text) 74%, var(--muted)); }
.f-label em { font-style: normal; font-weight: 500; color: var(--subtle); }
.f-box { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 12px; border: 1px solid var(--bs); border-radius: 10px; background: var(--panel); transition: border-color 0.18s, box-shadow 0.18s; }
.f-ic { font-size: 16px; color: var(--subtle); }
.f-val { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 14.5px; }
.f-val.ph { color: var(--subtle); }
.f-val.pw { letter-spacing: 0.18em; }
.f-eye { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 7px; color: var(--muted); font-size: 16px; }
.is-focus .f-box { border-color: var(--fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fill) 18%, transparent); }
.is-focus .f-ic { color: var(--accent); }
.is-error .f-box { border-color: color-mix(in srgb, var(--danger) 65%, transparent); }
.is-error.is-focus .f-box { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 15%, transparent); }
.f-msg { display: flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--subtle); font-size: 12px; }
.f-msg.err { color: var(--danger); }
.caret { display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--accent); animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.link { color: var(--accent); font-weight: 600; }
.alert { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--danger) 9%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 26%, transparent); color: var(--danger); font-size: 13px; line-height: 1.5; }
.alert svg { margin-top: 2px; font-size: 15px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 10px; font-size: 14.5px; font-weight: 650; letter-spacing: 0.01em; }
.btn-pri { margin-top: 20px; background: var(--fill); color: var(--on); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 1px 2px rgba(18, 22, 38, 0.14); }
.btn-pri.is-disabled { background: color-mix(in srgb, var(--fill) 38%, var(--pm)); color: color-mix(in srgb, var(--on) 80%, transparent); box-shadow: none; }
.btn-pri.is-loading { background: color-mix(in srgb, var(--fill) 82%, var(--panel)); }
.btn-pri .arrow { font-size: 16px; margin-left: -2px; }
.spin { font-size: 17px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.or { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--subtle); font-size: 12px; }
.or::before, .or::after { flex: 1; height: 1px; background: var(--border); content: ''; }
.btn-sec { margin-top: 14px; border: 1px solid var(--bs); background: var(--panel); color: var(--text); font-weight: 600; }
.btn-sec > svg { color: var(--accent); font-size: 17px; }
.badge { padding: 0 6px; border-radius: 5px; background: color-mix(in srgb, var(--fill) 13%, transparent); color: var(--accent); font-size: 11px; font-weight: 650; line-height: 18px; }
.note { margin-top: 8px; color: var(--subtle); font-size: 12px; text-align: center; }
.switch { margin-top: 18px; color: var(--muted); font-size: 13px; text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 26px; padding: 3px; border-radius: 10px; background: var(--pm); box-shadow: inset 0 0 0 1px var(--border); }
.seg span { display: grid; height: 32px; place-items: center; border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 600; }
.seg .on { background: var(--raise); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(18, 22, 38, 0.1); }
.tabs { display: flex; gap: 22px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.tabs span { position: relative; padding: 0 0 10px; color: var(--muted); font-size: 14px; font-weight: 600; }
.tabs .on { color: var(--text); }
.tabs .on::after { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--fill); content: ''; }
.float { animation: float 3.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px); } }
.no-motion .float, .no-motion .caret, .no-motion .spin, .no-motion .typing i { animation: none !important; }
.typing { display: inline-flex; gap: 4px; padding: 2px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.35; animation: typ 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes typ { 30% { opacity: 1; transform: translateY(-3px); } }
.av { display: grid; width: 32px; height: 32px; flex: none; place-items: center; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; }

/* ═════════ A 利落 ═════════ */
.A-desk { display: grid; grid-template-columns: 420px 1fr; height: 100%; }
.A-side { display: flex; flex-direction: column; padding: 30px 36px 32px; background: var(--window); border-right: 1px solid var(--border); }
.A-brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 750; letter-spacing: -0.01em; }
.A-chat { display: flex; flex-direction: column; gap: 10px; margin: auto 0; }
.A-msg { display: flex; align-items: flex-end; gap: 8px; }
.A-msg.me { justify-content: flex-end; }
.A-bub { max-width: 250px; padding: 9px 13px; border-radius: 14px 14px 14px 4px; background: var(--bubble-in); box-shadow: var(--bubble-shadow); font-size: 13.5px; }
.A-msg.me .A-bub { border-radius: 14px 14px 4px 14px; background: var(--fill); color: var(--on); }
.A-name { display: block; margin-bottom: 2px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.A-claim { font-size: 24px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.35; }
.A-meta { margin-top: 10px; color: var(--subtle); font-size: 12px; font-variant-numeric: tabular-nums; }
.A-main { display: grid; place-items: center; padding: 40px; }
.A-main .form { max-width: 352px; }
.A-m { padding: 64px 24px 30px; background: var(--panel); }
.A-m .A-brand { margin-bottom: 40px; }
.A-m .h { font-size: 28px; }
.A-m .form { margin: auto 0; }
.A-m.reg .A-brand { margin-bottom: 26px; }
.A-m .foot { margin-top: auto; padding-top: 20px; color: var(--subtle); font-size: 11.5px; text-align: center; }
.kb .A-m { padding-top: 52px; }
.kb .A-m .A-brand { margin-bottom: 18px; }
.kb .A-m .seg { display: none; }

/* ═════════ B 夜幕 ═════════ */
.B-ink {
  position: relative; overflow: hidden; color: #fff;
  background:
    radial-gradient(62% 48% at 84% 10%, color-mix(in srgb, var(--fill) 58%, transparent), transparent 72%),
    radial-gradient(56% 46% at 8% 94%, rgba(140, 92, 240, 0.5), transparent 72%),
    #0c0e16;
}
.B-ink::before { position: absolute; inset: 0; background: radial-gradient(42% 30% at 50% 44%, rgba(120, 110, 255, 0.22), transparent 70%); content: ''; }
.B-center { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.B-center .logo { box-shadow: 0 18px 44px -10px rgba(122, 85, 214, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08); }
.B-eyebrow { margin-top: 18px; color: #8d93a2; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2em; }
.B-word { margin-top: 4px; font-size: 34px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
.B-tag { margin-top: 8px; color: #a8afbe; font-size: 13.5px; }
.B-chip { position: absolute; display: grid; place-items: center; background: rgba(255, 255, 255, 0.09); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); backdrop-filter: blur(6px); }
.B-desk { display: grid; grid-template-columns: 500px 1fr; height: 100%; padding: 12px; gap: 0; }
.B-desk .B-ink { display: grid; place-items: center; border-radius: 16px; }
.B-desk .B-foot { position: absolute; left: 26px; right: 26px; bottom: 22px; display: flex; justify-content: space-between; color: rgba(226, 232, 245, 0.5); font-size: 12px; }
.B-main { display: grid; place-items: center; padding: 40px 40px 40px 52px; }
.B-main .form { max-width: 352px; }
.B-m { flex: 1; display: flex; flex-direction: column; background: #0c0e16; }
.B-m .B-ink { flex: none; display: grid; place-items: center; height: 340px; padding-top: 30px; transition: height 0.3s var(--ease); }
.B-m.reg .B-ink { height: 240px; }
.B-m.reg .B-tag, .B-m.reg .B-eyebrow { display: none; }
.B-sheet { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; margin-top: -18px; padding: 26px 22px 26px; border-radius: 26px 26px 0 0; background: var(--panel); }
.dark .B-sheet { box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.08); }
.B-sheet .foot { margin-top: auto; padding-top: 16px; color: var(--subtle); font-size: 11.5px; letter-spacing: 0.06em; text-align: center; }
.kb .B-m .B-ink { height: 150px; }
.kb .B-m .B-ink .logo { --s: 48px !important; }
.kb .B-m .B-eyebrow, .kb .B-m .B-tag, .kb .B-m .B-chip { display: none; }
.kb .B-m .B-word { font-size: 20px; }
.kb .B-m .B-center { flex-direction: row; gap: 12px; }
.kb .B-m .B-word { margin-top: 0; }

/* ═════════ C 积木 ═════════ */
.C-ws { position: relative; overflow: hidden; background-color: #f3f4f8; background-image: radial-gradient(circle, rgba(18, 22, 38, 0.13) 1px, transparent 1.6px); background-size: 22px 22px; }
.dark .C-ws { background-color: #111217; background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1.6px); }
/* 品牌：新 Logo 的「KukeChat + NEXT」字标（轮廓化 SVG，和 logo.html 同源） */
.C-brand { position: relative; z-index: 2; display: flex; align-items: center; flex: none; pointer-events: none; }
.C-brand svg { display: block; height: 100%; width: auto; }
.C-desk { display: grid; grid-template-columns: 1fr 470px; height: 100%; }
.C-desk .C-ws { display: flex; flex-direction: column; padding: 30px 40px 32px; border-right: 1px solid var(--border); }
.C-desk .C-stage { position: relative; z-index: 3; flex: 1; margin: 6px -40px 10px; --bs: 1; }
.C-desk .C-claim { position: relative; z-index: 2; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.4; pointer-events: none; }
.C-desk .C-claim span { color: var(--accent); }
.C-desk .A-meta { position: relative; z-index: 2; }
.C-main { display: grid; place-items: center; padding: 40px 52px; }
.C .f-box { border-radius: 22px; padding-left: 16px; }
.C .alert { border-radius: 12px; }
.C .btn { border-radius: 8px; }
.C .btn-pri { position: relative; }
.C .btn-pri::before { position: absolute; top: 0; left: 18px; width: 30px; height: 6px; background: var(--panel); clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); content: ''; }
.C .btn-pri::after { position: absolute; bottom: -6px; left: 18px; width: 30px; height: 6px; background: inherit; clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); content: ''; }
.C .btn-pri.is-disabled::after { opacity: 0.9; }
.C-m { flex: 1; display: flex; flex-direction: column; background: var(--panel); }
.C-m .C-ws { flex: none; height: 330px; padding: 52px 22px 0; border-bottom: 1px solid var(--border); }
.C-m.reg .C-ws { height: 230px; }
.C-m .C-stage { position: absolute; left: 0; right: 0; top: 92px; bottom: 0; --bs: 0.8; }
.C-m .C-body { flex: 1; display: flex; flex-direction: column; padding: 24px 22px 26px; }
.C-m .foot { margin-top: auto; padding-top: 16px; color: var(--subtle); font-size: 11.5px; text-align: center; }
.kb .C-m .C-ws { height: 110px; }
.kb .C-m .C-stage { display: none; }

/* 兜底静态积木（CDN 读不到时） */
.C-stack { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
.blk { position: relative; display: flex; align-items: center; gap: 8px; height: 48px; margin-top: -1px; padding: 0 16px 0 14px; color: #fff; font-size: 15px; font-weight: 650; white-space: nowrap; }
.blk > svg.shape { position: absolute; inset: 0 auto auto 0; overflow: visible; }
.blk > :not(svg.shape) { position: relative; }
.blk.hat { height: 66px; padding-top: 18px; }
.blk.ev { color: #4a3400; }
.rep { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 14px; background: #fff; color: #3d3f47; font-size: 13.5px; font-weight: 600; }
.rep.drop { border-radius: 6px; background: rgba(0, 0, 0, 0.14); color: #fff; }
.flag { color: #2a9d3f; fill: #3fbf55 !important; stroke: #2a8a3a !important; font-size: 20px; }
.sb-fallback .C-stack { transform: scale(var(--bs, 1)); }

/* Scratch 3 积木工作区：积木由 scratchblocks 渲染，拖动 / 吸附 / 运行是这里自己写的 */
.sb-layer { position: absolute; left: 0; top: 0; width: calc(100% / var(--bs, 1)); height: calc(100% / var(--bs, 1)); transform: scale(var(--bs, 1)); transform-origin: 0 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.sb-probe { position: absolute; left: 0; top: 0; width: 100px; height: 0; visibility: hidden; }
.sb-blk { position: absolute; left: 0; top: 0; pointer-events: none; transform-origin: 0 0; transition: transform 0.34s var(--ease); }
.sb-blk svg { display: block; overflow: visible; }
.sb-blk .sb3-label { font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
.sb-blk path, .sb-blk rect, .sb-blk text, .sb-blk use { pointer-events: auto; cursor: grab; }
.sb-blk svg { transition: filter 0.12s; }
.sb-blk.glow svg { filter: drop-shadow(0 0 1px #fff200) drop-shadow(0 0 2px #fff200) drop-shadow(0 0 5px rgba(255, 228, 0, 0.75)); }
.sb-drag { position: absolute; left: 0; top: 0; z-index: 500; will-change: transform; }
.sb-lift { transition: transform 0.16s var(--ease), filter 0.16s; }
.sb-lift.on { transform: scale(1.04); filter: drop-shadow(0 14px 14px rgba(18, 22, 38, 0.26)) drop-shadow(0 2px 3px rgba(18, 22, 38, 0.16)); }
.dark .sb-lift.on { filter: drop-shadow(0 16px 16px rgba(0, 0, 0, 0.6)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4)); }
.sb-drag .sb-blk { transition: none; }
.sb-drag .sb-blk path, .sb-drag .sb-blk rect, .sb-drag .sb-blk text, .sb-drag .sb-blk use { cursor: grabbing; }
/* 吸附预览：和 Scratch 一样是被拖那串积木的灰色剪影 */
.sb-ghost { position: absolute; left: 0; top: 0; z-index: 0; opacity: 0.2; pointer-events: none; }
.sb-ghost svg { position: absolute; left: 0; overflow: visible; }
.sb-ghost path { fill: #000 !important; stroke: none !important; }
.dark .sb-ghost { opacity: 0.22; }
.dark .sb-ghost path { fill: #fff !important; }
/* 「说」积木的对话气泡：Scratch 舞台上角色说话气泡的样子 */
.sb-say { position: absolute; z-index: 3; bottom: calc(100% - 6px); left: calc(100% - 26px); padding: 7px 13px; border: 2px solid rgba(0, 0, 0, 0.15); border-radius: 16px; background: #fff; background-clip: padding-box; color: #575e75; font: 600 14px/1.3 'Helvetica Neue', Helvetica, Arial, sans-serif; white-space: nowrap; pointer-events: none; transform-origin: 18px 100%; animation: sb-pop 0.3s cubic-bezier(0.19, 1.18, 0.22, 1); }
.sb-say::after { position: absolute; left: 14px; bottom: -9px; width: 12px; height: 12px; border: solid rgba(0, 0, 0, 0.15); border-width: 0 0 2px 2px; border-bottom-left-radius: 3px; background: #fff; transform: skewY(-38deg); content: ''; }
.sb-say.out { opacity: 0; transform: scale(0.9); transition: opacity 0.2s, transform 0.2s; }
@keyframes sb-pop { from { opacity: 0; transform: scale(0.6); } }
/* 点报告积木出来的值气泡 */
.sb-val { position: absolute; top: calc(100% + 6px); left: 50%; padding: 3px 10px; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; background: #fff; color: #575e75; font: 600 13px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; transform: translateX(-50%); box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.15); }
.sb-val::before { position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border: solid rgba(0, 0, 0, 0.15); border-width: 1px 0 0 1px; background: #fff; transform: rotate(45deg); content: ''; }
.sb-tip { position: absolute; z-index: 2; right: 40px; bottom: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 80%, transparent); box-shadow: 0 0 0 1px var(--border); color: var(--muted); font-size: 12px; font-weight: 600; pointer-events: none; transition: opacity 0.4s; }
.C-m .sb-tip { right: 14px; bottom: 10px; font-size: 11px; }
.sb-ws.touched .sb-tip { opacity: 0; }
.sb-fallback { position: absolute; inset: 0; display: grid; place-items: center; }
/* 最后一块积木执行时，右侧表单轻轻提示一下 */
.C-nudge .btn-pri { animation: sb-nudge 0.9s var(--ease) 2; }
@keyframes sb-nudge { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--fill) 55%, transparent); } 100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--fill) 0%, transparent); } }
.C-nudge .f:first-child .f-box { border-color: var(--fill); transition: border-color 0.3s; }
/* 动效关 / 系统减少动态效果：不弹、不缩放、不脉冲，只保留状态 */
.no-motion .sb-blk, .no-motion .sb-lift, .no-motion .sb-blk svg { transition: none !important; }
.no-motion .sb-lift.on { transform: none; }
.no-motion .sb-say { animation: none; }
.no-motion .C-nudge .btn-pri { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--fill) 35%, transparent); }
@media (prefers-reduced-motion: reduce) {
  .sb-blk, .sb-lift, .sb-blk svg { transition: none !important; }
  .sb-lift.on { transform: none; }
  .sb-say { animation: none; }
  .C-nudge .btn-pri { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--fill) 35%, transparent); }
}

<header class="top">
  <h1>登录页 · 设计方案</h1>
  <div class="grp"><span>方案</span><div class="pill" data-k="c"></div></div>
  <div class="grp"><span>主题</span><div class="pill" data-k="theme"></div></div>
  <div class="grp"><span>状态</span><div class="pill" data-k="st"></div></div>

<p class="intro">
  四个方向，每个都画了 <b>桌面登录（1100×720）</b>、<b>手机登录</b>、<b>手机注册（412×892）</b>，浅色 / 深色各一套。
  顶部「状态」切换输入框聚焦、错误提示、登录中；「手机键盘」看软键盘弹起时品牌区怎么让位；「动效」关掉等同于性能优先 / 减少动态效果。
  颜色全部取 kui.css 的令牌，强调色 <b>#1F6BFF</b> 统一走 <code>--fill</code>，换主题强调色时整页跟着变。
</p>

function field({ label, aside, icon, value, ph, pw, focus, error, hint, eye }) {
  const shown = value ? (pw ? '•'.repeat(value.length) : value) : ph;
  return `<label class="f ${focus ? 'is-focus' : ''} ${error ? 'is-error' : ''}">

    ${error ? `<span class="f-msg err">${ic('alert')}${error}</span>` : hint ? `<span class="f-msg">${hint}</span>` : ''}

}

    : sw === 'tabs' ? `<div class="tabs"><span class="${reg ? '' : 'on'}">登录</span><span class="${reg ? 'on' : ''}">注册新账号</span></div>` : '';
  const heading = head ? `<p class="h">${reg ? '创建账号' : '欢迎回来'}</p><p class="sub">${reg ? '起个名字，几秒钟就好。' : '登录后继续你的 Scratch 社交空间。'}</p>` : '';
  let fields;
  let alert = '';

  if (!reg) {
    const focusUser = st === 'focus' && where === 'mob';

    fields = field({ label: '用户名', icon: icons && 'user', value: focusUser ? 'kuk' : 'kuke', ph: '输入用户名', focus: focusUser })
      + field({ label: '密码', icon: icons && 'lock', value: st === 'idle' || focusUser ? '' : st === 'focus' ? 'scratc' : 'scratch3', ph: '输入密码', pw: true, eye: true, focus: focusPass });

/*
 * 积木外观：scratchblocks（scratch3 主题，zh_cn 语法）把每一块单独渲染成 SVG，形状、配色、描边、字体都是它的。
 * 拖动 / 吸附 / 运行是下面自己写的一小段（不依赖 Blockly），模型就是「若干串积木，每串 = 左上角坐标 + 积木 id 列表」。

  const y0 = hat ? 18 : 0;
  const H = h + y0;
  const d = `${top} a6,6 0 0 1 6,6 V${H - 6} a6,6 0 0 1 -6,6 H48 c-2,0 -3,1 -4,2 l-4,4 c-1,1 -2,2 -4,2 h-12 c-2,0 -3,-1 -4,-2 l-4,-4 c-1,-1 -2,-2 -4,-2 H6 a6,6 0 0 1 -6,-6 Z`;
  return `<svg class="shape" width="${w}" height="${H + 8}" viewBox="0 0 ${w} ${H + 8}"><path d="${d}" fill="${color}" stroke="rgba(0,0,0,.16)" stroke-width="1"/></svg>`;
}

function extensionize(el, def) {

/*
 * 接缝：scratchblocks 每块都单独描一圈 1px 深色边。摞起来以后，上面那块的底边描边和下面那块的顶边描边（含凹口那一段）
 * 叠成一条深色线，缩放到 0.8 时两块的抗锯齿边还会透出一丝底色。所以改成：
 *   ① 描边单独一条路径，画在本块填充下面（只露外侧一半，宽度加到 2 让外轮廓粗细不变）；
 *   ② 上面接着积木时，把顶边这一段（含凹口）的描边裁掉（.sb-clip，宽度 = 两块重叠的宽度，摆放时更新）；
 *   ③ 下面接着积木时，在底边垫一条本块颜色的填充（.sb-filler），伸进下一块 1px，被下一块盖住，抗锯齿不再透底。
 * 结果和 Scratch 编辑器一样：接缝处只剩上一块的凸起嵌在下一块的凹口里，没有额外的线。
 */
function seamless(el, w, h, body) {
  document.body.appendChild(el); // 读 scratchblocks 样式表算出来的颜色
  const shape = el.querySelector('path');
  const cs = getComputedStyle(shape); const fill = shape.style.fill || cs.fill; const stroke = shape.style.stroke || cs.stroke;
  el.remove();

  const clip = svgEl('clipPath', { id: '__CLIP__' });
  clip.appendChild(svgEl('path', { class: 'sb-clip', 'clip-rule': 'evenodd', d: `M-20 -20 H${w + 20} V${h + 20} H-20 Z` }));
  const edge = svgEl('path', { class: 'sb-edge', d: shape.getAttribute('d'), fill: 'none', stroke, 'stroke-width': 2, 'stroke-linejoin': 'round', 'clip-path': 'url(#__CLIP__)' });

/* above / below：和上 / 下一块重叠的宽度（积木坐标），0 = 没接 */

      const el = scratchblocks.render(scratchblocks.parse(def.code, SB_OPTS), SB_OPTS);
      const d = el.querySelector('defs');
      if (d) { if (!defs) defs = d.cloneNode(true); d.remove(); } // 公共图形（绿旗、下拉箭头）只留一份
      const w = +el.getAttribute('width'); const h = +el.getAttribute('height');
      const body = def.rep ? h - 2 : h - 10;
      if (def.ext) extensionize(el, def);
      // scratchblocks 每块外面有 (2,1) 的留白；命令积木底下多 8 的凸起。所以下一块的 y = 本块 y + (高 − 10)
      const ghost = el.cloneNode(true);
      const gshape = ghost.querySelector('path, rect');
      [...gshape.parentNode.children].forEach((c) => c !== gshape && c.remove());
      if (!def.rep) seamless(el, w, h, body);
      SB.cache[id] = { svg: el.outerHTML, ghost: ghost.outerHTML, w, h, body, sw: w - 4 };
    }
    if (defs) {
      const holder = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      holder.setAttribute('width', '0'); holder.setAttribute('height', '0');
      holder.setAttribute('aria-hidden', 'true');
      holder.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
      holder.appendChild(defs);
      document.body.appendChild(holder);
    }
    SB.ok = true;
  } catch (err) {
    console.warn('scratchblocks 渲染失败，退回静态积木', err);
  } finally {
    proto.measureText = measure;
  }
  return SB.ok;
}

/* 每块画板一份模型；重新渲染（切主题 / 状态）时位置保留 */
const WS = {};
const SNAP = 40; // 吸附半径（画板单位，≈ Scratch 编辑器 100% 缩放下的手感）
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function wsInitModel(id, kind, W, H) {
  const ids = kind === 'reg' ? ['hat', 'create'] : ['hat', 'say', 'open', 'chat'];
  const sw = Math.max(...ids.map((i) => SB.cache[i].w));
  const sh = ids.reduce((a, i) => a + SB.cache[i].body, 0) + 8;
  const stacks = [];
  if (kind === 'desk') {
    // 扩展积木比较宽：积木串放左下，报告积木放右上
    const x = Math.round(Math.max(40, (W - sw) / 2 - 70)); const y = Math.round(Math.max(110, (H - sh) / 2 + 40));
    stacks.push({ x, y, ids });
    stacks.push({ x: Math.round(W - SB.cache.online.w - 44), y: Math.round(y - 104), ids: ['online'] });
  } else if (kind === 'mob') {
    stacks.push({ x: 26, y: 10, ids }); // 手机画板放不下报告积木
  } else {
    stacks.push({ x: 30, y: 8, ids });
  }
  return { stacks, touched: false };
}

function mountStage(stage) {
  const id = stage.dataset.ws; const kind = stage.dataset.kind;
  stage.innerHTML = '';
  if (!sbInit()) { stage.innerHTML = `<div class="sb-fallback">${stackFallback(kind === 'reg')}</div>`; return; }
  const layer = document.createElement('div');
  layer.className = 'sb-layer';
  layer.innerHTML = '<i class="sb-probe"></i>';
  stage.appendChild(layer);
  if (!layer.offsetWidth) { stage.innerHTML = ''; return; } // 键盘弹起时画板是收起的
  const model = WS[id] || (WS[id] = wsInitModel(id, kind, layer.offsetWidth, layer.offsetHeight));
  const ws = { id, stage, layer, model, els: {}, drag: null, preview: null, running: null };
  stage.classList.toggle('touched', model.touched);
  stage.insertAdjacentHTML('beforeend', `<span class="sb-tip">${ic('pointer')}拖动积木试试，点一下就运行</span>`);
  for (const s of model.stacks) for (const bid of s.ids) {
    const el = document.createElement('div');
    el.className = 'sb-blk'; el.dataset.id = bid;
    el.innerHTML = SB.cache[bid].svg.replaceAll('__CLIP__', `sbc-${id}-${bid}`) + (SB_DEFS[bid].rep ? `<span class="sb-val">${SB_DEFS[bid].value}</span>` : '');
    layer.appendChild(el);
    ws.els[bid] = el;
  }
  ws.ghost = document.createElement('div');
  ws.ghost.className = 'sb-ghost';
  ws.ghost.hidden = true;
  layer.appendChild(ws.ghost);
  layout(ws, true);
  bindDrag(ws);
}
function mountWorkspaces() { document.querySelectorAll('.C-stage[data-ws]').forEach(mountStage); }

const H_ = (bid) => SB.cache[bid].body;
const stackH = (ids) => ids.reduce((a, b) => a + H_(b), 0);
const setT = (el, x, y, s = 1) => { el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };

/* 按模型摆放所有积木；有吸附预览时，插入点下面的积木让出位置 */
function layout(ws, instant) {
  const p = ws.preview;
  let z = 1;
  for (const s of ws.model.stacks) {
    let y = s.y;
    joinRun(ws, s.ids, p && p.stack === s && p.type === 'insert' ? p.at : -1);
    s.ids.forEach((bid, i) => {
      if (p && p.stack === s && p.at === i && p.type === 'insert') y += ws.drag.h;
      const el = ws.els[bid];
      if (instant) el.style.transition = 'none';
      setT(el, s.x, y); el.style.zIndex = z++;
      if (instant) { el.offsetWidth; el.style.transition = ''; }
      y += H_(bid);
    });
  }
}

/* 屏幕坐标 → 画板坐标（同时兼容外层 zoom 和手机画板里的 scale） */
function toLocal(ws, e) {
  const r = ws.layer.getBoundingClientRect();
  const unit = ws.layer.firstChild.getBoundingClientRect().width / 100;
  return { x: (e.clientX - r.left) / unit, y: (e.clientY - r.top) / unit, unit };
}
const findStack = (ws, bid) => ws.model.stacks.find((s) => s.ids.includes(bid));

function bindDrag(ws) {
  const L = ws.layer;
  let press = null;
  L.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || ws.drag || press) return;
    const el = e.target.closest('.sb-blk');
    if (!el) return;
    e.preventDefault();
    press = { id: el.dataset.id, pid: e.pointerId, cx: e.clientX, cy: e.clientY, p: toLocal(ws, e) };
    L.setPointerCapture(e.pointerId);
  });
  L.addEventListener('pointermove', (e) => {
    if (!press || e.pointerId !== press.pid) return;
    if (!ws.drag) {
      if (Math.hypot(e.clientX - press.cx, e.clientY - press.cy) < 4) return;
      startDrag(ws, press);
    }
    ws.drag.last = e;
    if (!ws.drag.raf) ws.drag.raf = requestAnimationFrame(() => { ws.drag.raf = 0; moveDrag(ws, ws.drag.last); });
  });
  const end = (e) => {
    if (!press || e.pointerId !== press.pid) return;
    if (L.hasPointerCapture(e.pointerId)) L.releasePointerCapture(e.pointerId);
    if (ws.drag) { if (ws.drag.raf) cancelAnimationFrame(ws.drag.raf); moveDrag(ws, e); endDrag(ws, e.type === 'pointercancel'); }
    else if (e.type === 'pointerup') clickBlock(ws, press.id);
    press = null;
  };
  L.addEventListener('pointerup', end);
  L.addEventListener('pointercancel', end);
}

function touch(ws) { if (!ws.model.touched) { ws.model.touched = true; ws.stage.classList.add('touched'); } }

function startDrag(ws, press) {
  touch(ws);
  const s = findStack(ws, press.id);
  const i = s.ids.indexOf(press.id);
  const top = { x: s.x, y: s.y + stackH(s.ids.slice(0, i)) };
  const ids = s.ids.splice(i); // 从拖住的那块往下整串拿走
  if (!s.ids.length) ws.model.stacks.splice(ws.model.stacks.indexOf(s), 1);
  else if (i > 0 && SB_DEFS[ids[0]].hat) { /* 帽子只会在第 0 块，这里不会发生 */ }
  const gx = press.p.x - top.x; const gy = press.p.y - top.y;
  const wrap = document.createElement('div'); wrap.className = 'sb-drag';
  const lift = document.createElement('div'); lift.className = 'sb-lift';
  lift.style.transformOrigin = `${gx}px ${gy}px`;
  let yy = 0;
  for (const bid of ids) { const el = ws.els[bid]; el.style.zIndex = ''; setT(el, 0, yy); lift.appendChild(el); yy += H_(bid); }
  joinRun(ws, ids);
  wrap.appendChild(lift); ws.layer.appendChild(wrap);
  setT(wrap, top.x, top.y);
  ws.ghost.innerHTML = ids.reduce((acc, bid, k) => acc + SB.cache[bid].ghost.replace('<svg ', `<svg style="top:${stackH(ids.slice(0, k))}px" `), '');
  ws.drag = { ids, h: stackH(ids), gx, gy, x: top.x, y: top.y, wrap, lift, hat: !!SB_DEFS[ids[0]].hat, rep: !!SB_DEFS[ids[0]].rep };
  requestAnimationFrame(() => lift.classList.add('on'));
  layout(ws); // 原来那串补上空位
}

/* 找最近的连接点：接在某块下面（插入 / 接到末尾），或者把整串顶到另一串上面 */
function findSnap(ws, x, y) {
  const d = ws.drag;
  if (d.rep) return null; // 报告积木不进命令串
  let best = null; let bd = SNAP;
  for (const s of ws.model.stacks) {
    if (SB_DEFS[s.ids[0]].rep) continue;
    if (!d.hat) {
      let yy = s.y;
      for (let at = 1; at <= s.ids.length; at++) {
        yy += H_(s.ids[at - 1]);
        const dist = Math.hypot(x - s.x, y - yy);
        if (dist < bd) { bd = dist; best = { type: 'insert', stack: s, at, gx: s.x, gy: yy }; }
      }
    }
    if (!SB_DEFS[s.ids[0]].hat) { // 帽子积木上面不能再接东西
      const dist = Math.hypot(x - s.x, y + d.h - s.y);
      if (dist < bd) { bd = dist; best = { type: 'top', stack: s, at: 0, gx: s.x, gy: s.y - d.h }; }
    }
  }
  return best;
}

function moveDrag(ws, e) {
  const d = ws.drag; const p = toLocal(ws, e);
  d.x = p.x - d.gx; d.y = p.y - d.gy;
  setT(d.wrap, d.x, d.y);
  const snap = findSnap(ws, d.x, d.y);
  const same = snap && ws.preview && snap.stack === ws.preview.stack && snap.at === ws.preview.at && snap.type === ws.preview.type;
  if (same || (!snap && !ws.preview)) return;
  ws.preview = snap;
  if (snap) { ws.ghost.hidden = false; setT(ws.ghost, snap.gx, snap.gy); } else ws.ghost.hidden = true;
  layout(ws);
}

function endDrag(ws, cancelled) {
  const d = ws.drag; const snap = cancelled ? null : ws.preview;
  ws.preview = null; ws.ghost.hidden = true; ws.drag = null;
  let target;
  if (snap && snap.type === 'insert') { snap.stack.ids.splice(snap.at, 0, ...d.ids); target = snap.stack; }
  else if (snap) { snap.stack.ids.unshift(...d.ids); snap.stack.y -= d.h; target = snap.stack; }
  else { target = { x: d.x, y: d.y, ids: d.ids }; ws.model.stacks.push(target); }
  // 留在原地，但整串都要待在画板里（顶上去的串也可能被推出上沿）
  const W = ws.layer.offsetWidth; const H = ws.layer.offsetHeight;
  const tw = Math.max(...target.ids.map((b) => SB.cache[b].w)); const th = stackH(target.ids) + (SB_DEFS[target.ids[0]].rep ? 34 : 10);
  target.x = Math.round(Math.max(6, Math.min(target.x, W - tw - 6)));
  target.y = Math.round(Math.max(SB_DEFS[target.ids[0]].hat ? 14 : 2, Math.min(target.y, H - th)));
  // 刚放下的那串放到最上层
  ws.model.stacks.splice(ws.model.stacks.indexOf(target), 1); ws.model.stacks.push(target);
  // 先把积木放回画板、停在松手时的位置（含放大），下一帧再过渡到落点
  const sc = d.lift.classList.contains('on') && !ws.stage.closest('.no-motion') && !reduceMotion() ? 1.04 : 1;
  let yy = 0;
  for (const bid of d.ids) {
    const el = ws.els[bid];
    el.style.transition = 'none';
    setT(el, d.x + d.gx - d.gx * sc, d.y + d.gy + (yy - d.gy) * sc, sc);
    ws.layer.insertBefore(el, ws.ghost);
    yy += H_(bid);
  }
  d.wrap.remove();
  ws.layer.offsetWidth;
  for (const bid of d.ids) ws.els[bid].style.transition = '';
  layout(ws);
}

/* 点一下：整串按顺序执行，带 Scratch 运行时的黄色发光 */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function clickBlock(ws, bid) {
  touch(ws);
  const def = SB_DEFS[bid];
  if (def.rep) { // 报告积木：值气泡闪一下
    const v = ws.els[bid].querySelector('.sb-val');
    v.animate?.([{ transform: 'translateX(-50%) scale(1.15)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 260, easing: 'ease-out' });
    return;
  }
  if (ws.running) return;
  const s = findStack(ws, bid);
  const ids = s.ids.slice();
  ws.running = true;
  const form = ws.stage.closest('.frame')?.querySelector('.form');
  let bubble = null;
  for (let k = 0; k < ids.length; k++) {
    const el = ws.els[ids[k]];
    if (!el.isConnected) break;
    el.classList.add('glow');
    if (SB_DEFS[ids[k]].say) {
      bubble?.remove();
      bubble = document.createElement('span'); bubble.className = 'sb-say'; bubble.textContent = SB_DEFS[ids[k]].say;
      el.appendChild(bubble);
    }
    if (k === ids.length - 1 && form) { form.classList.remove('C-nudge'); form.offsetWidth; form.classList.add('C-nudge'); setTimeout(() => form.classList.remove('C-nudge'), 1900); }
    await wait(SB_DEFS[ids[k]].say ? 700 : 420);
    el.classList.remove('glow');
  }
  ws.running = false;
  if (bubble) { await wait(1300); bubble.classList.add('out'); await wait(220); bubble.remove(); }
}

function render() {
  renderControls();
  const keys = S.c === 'all' ? Object.keys(CONCEPTS) : [S.c];
  const themes = S.theme === 'both' ? ['light', 'dark'] : [S.theme];
  document.getElementById('out').innerHTML = keys.map((k, i) => {
    const c = CONCEPTS[k];
    const rows = themes.map((t) => `<div><span class="cap"><b>${t === 'light' ? '浅色' : '深色'}</b> · 桌面登录 / 手机登录 / 手机注册</span>
      <div class="theme-row">${c.desk(t)}${c.mob(t, 'login')}${c.mob(t, 'register')}</div></div>`).join('');
    const strips = themes.map((t) => c.states(t)).join('');
    return `${i ? '<hr class="sep">' : ''}<section class="concept ${S.motion === 'off' ? 'no-motion' : ''}" id="c-${k}">
      <div class="concept-head"><span class="concept-tag">${k}</span><h2>${c.name}<small>${c.en}</small></h2><p>${c.desc}</p>
        <div class="concept-notes">${c.notes.map((n) => `<span>${n}</span>`).join('')}</div></div>
      <div class="board" style="--zoom:${S.zoom}">${rows}<div><span class="cap"><b>控件状态</b></span><div class="theme-row">${strips}</div></div></div>
    </section>`;
  }).join('');
  mountWorkspaces();
}
document.querySelector('.top').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-v]');
  if (!btn) return;
  S[btn.parentElement.dataset.k] = btn.dataset.v;
  render();
});
render();
</script>
</body>
</html>
